services:
  guild-checker:
    build: .
    container_name: guild-checker
    restart: unless-stopped
    environment:
      - DB_PATH=/app/data/guild.db
      - TZ=Asia/Seoul
      # - WORKERS=8        # 넥슨 API를 동시에 몇 개씩 부를지
      # - REP_TTL_DAYS=3   # 유니온 대표 캐릭터 결과를 며칠 동안 다시 쓸지
      # API 키는 사이트의 '설정' 탭에서 넣는 게 기본 (data/guild.db에 저장). 설정 탭이 비었을 때만 .env 값을 씀
      - NEXON_API_KEY=${NEXON_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-}
    ports:
      - "5080:5000"
    volumes:
      # SQLite DB (설정·API 키·캐시·지난 기록) — 컨테이너를 다시 빌드해도 남는다
      - ./data:/app/data
