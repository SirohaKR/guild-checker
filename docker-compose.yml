services:
  guild-checker:
    build: .
    container_name: guild-checker
    restart: unless-stopped
    environment:
      - DB_PATH=/app/data/guild.db
      - TZ=Asia/Seoul
      # - WORKERS=8        # 넥슨 API를 동시에 몇 개씩 부를지
      # - REP_TTL_DAYS=3   # 유니온 대표 캐릭터 결과를 며칠 동안 다시 쓸지
      # 스크린샷 닉네임 읽기용 Claude 설정 — .env 파일에서 가져옴 (.env.example 참고, 없으면 화면에서 키 입력)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-}
    ports:
      - "5080:5000"
    volumes:
      # SQLite DB (캐시·지난 검사 결과) — 컨테이너를 다시 빌드해도 남는다
      - ./data:/app/data
